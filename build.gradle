plugins {
    id 'application'
    id 'java'
}

group = 'com.jwhisper'
version = '0.1.0'

def runtimeVariant = providers.gradleProperty('jwhisperRuntime')
        .orElse(System.getenv('JWHISPER_RUNTIME') ?: 'cpu')
        .get()
        .toLowerCase(Locale.ROOT)
if (!['cpu', 'apple', 'gpu'].contains(runtimeVariant)) {
    throw new GradleException("Unsupported jwhisperRuntime '${runtimeVariant}'. Use cpu, apple, or gpu.")
}
def onnxRuntimeArtifact = runtimeVariant == 'gpu' ? 'onnxruntime_gpu' : 'onnxruntime'
def projectVersion = version.toString()

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation "com.microsoft.onnxruntime:${onnxRuntimeArtifact}:1.26.0"
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.0'
    implementation 'com.github.wendykierp:JTransforms:3.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.0'
}

def defaultJvmArgs = [
        '-Dapple.laf.useScreenMenuBar=true',
        '-Dcom.apple.mrj.application.apple.menu.about.name=JWhisper',
        '-Dapple.awt.application.name=JWhisper',
        "-Djwhisper.runtimeVariant=${runtimeVariant}"
]
if (JavaVersion.current().majorVersion.toInteger() >= 22) {
    defaultJvmArgs.add('--enable-native-access=ALL-UNNAMED')
}

application {
    mainClass = 'com.jwhisper.JWhisperApp'
    applicationDefaultJvmArgs = defaultJvmArgs
}

tasks.named('run', JavaExec) {
    def osName = System.getProperty('os.name', '').toLowerCase(Locale.ROOT)
    if (osName.contains('mac')) {
        jvmArgs('-Xdock:name=JWhisper')
        def macIcon = file('assets/brand/icon.icns')
        if (macIcon.isFile()) {
            jvmArgs("-Xdock:icon=${macIcon.absolutePath}")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs.add('-Xlint:deprecation')
}

tasks.named('test') {
    useJUnitPlatform()
    if (JavaVersion.current().majorVersion.toInteger() >= 22) {
        jvmArgs('--enable-native-access=ALL-UNNAMED')
    }
}

tasks.named('processResources') {
    inputs.property('runtimeVariant', runtimeVariant)
    inputs.property('onnxRuntimeArtifact', onnxRuntimeArtifact)
    filesMatching('com/jwhisper/build.properties') {
        expand(
                version: projectVersion,
                runtimeVariant: runtimeVariant,
                onnxRuntimeArtifact: onnxRuntimeArtifact
        )
    }
}

tasks.named('jar') {
    archiveClassifier = runtimeVariant
    manifest {
        attributes(
                'Main-Class': application.mainClass.get(),
                'Implementation-Title': 'JWhisper',
                'Implementation-Version': projectVersion,
                'Jwhisper-Runtime-Variant': runtimeVariant,
                'Jwhisper-OnnxRuntime-Artifact': onnxRuntimeArtifact,
                'Enable-Native-Access': 'ALL-UNNAMED'
        )
    }
}

tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Builds a runnable jar with runtime dependencies.'
    archiveBaseName = 'jwhisper'
    archiveClassifier = "${runtimeVariant}-all"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                'Main-Class': application.mainClass.get(),
                'Implementation-Title': 'JWhisper',
                'Implementation-Version': projectVersion,
                'Jwhisper-Runtime-Variant': runtimeVariant,
                'Jwhisper-OnnxRuntime-Artifact': onnxRuntimeArtifact,
                'Enable-Native-Access': 'ALL-UNNAMED'
        )
    }
    exclude('META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
    from(sourceSets.main.output)
    from({
        configurations.runtimeClasspath.collect { file ->
            file.isDirectory() ? file : zipTree(file)
        }
    })
}

tasks.register('cli', JavaExec) {
    group = 'application'
    description = 'Runs the headless JWhisper CLI. Pass arguments with --args.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.jwhisper.cli.JWhisperCli'
    if (JavaVersion.current().majorVersion.toInteger() >= 22) {
        jvmArgs('--enable-native-access=ALL-UNNAMED')
    }
}

tasks.register('printRuntimeClasspath') {
    group = 'help'
    description = 'Prints the main runtime classpath for demo and integration scripts.'
    dependsOn tasks.named('classes')
    doLast {
        println sourceSets.main.runtimeClasspath.asPath
    }
}

tasks.register('packageAppImage', Exec) {
    group = 'distribution'
    description = 'Builds a self-contained desktop app image with jpackage.'
    dependsOn tasks.named('fatJar')
    doFirst {
        def osName = System.getProperty('os.name', '').toLowerCase(Locale.ROOT)
        def windows = osName.contains('win')
        def mac = osName.contains('mac')
        def jpackage = new File(System.getProperty('java.home'), 'bin/' + (windows ? 'jpackage.exe' : 'jpackage'))
        if (!jpackage.isFile()) {
            throw new GradleException("jpackage was not found in the selected JDK: ${jpackage}")
        }
        def iconFile = mac
                ? file('assets/brand/icon.icns')
                : (windows ? file('assets/brand/icon.ico') : file('assets/brand/icon-512.png'))
        if (!iconFile.isFile()) {
            throw new GradleException("Application icon file is missing: ${iconFile}")
        }
        def destination = layout.buildDirectory.dir('package').get().asFile
        delete destination
        destination.mkdirs()

        def stagingInput = layout.buildDirectory.dir('tmp/jpackage-input').get().asFile
        delete stagingInput
        stagingInput.mkdirs()
        def fatJarFile = tasks.named('fatJar').get().archiveFile.get().asFile
        copy {
            from fatJarFile
            into stagingInput
        }

        def versionTokens = projectVersion.replaceAll('[^0-9.]', '').tokenize('.').findAll { !it.isEmpty() }
        while (versionTokens.size() < 3) {
            versionTokens.add('0')
        }
        def versionInts = versionTokens.take(3).collect { it.toInteger() }
        // macOS jpackage requires CFBundleShortVersionString major integer >= 1
        def jpackageVersion = (mac && versionInts[0] <= 0) ? '1.0.0' : versionInts.join('.')

        def cmd = [
                jpackage.absolutePath,
                '--type', 'app-image',
                '--name', 'JWhisper',
                '--vendor', 'JWhisper',
                '--icon', iconFile.absolutePath,
                '--dest', destination.absolutePath,
                '--input', stagingInput.absolutePath,
                '--main-jar', fatJarFile.name,
                '--main-class', application.mainClass.get(),
                '--app-version', jpackageVersion,
                '--description', 'Local-first Whisper transcription for the JVM',
                '--java-options', '-Dapple.laf.useScreenMenuBar=true',
                '--java-options', '-Dapple.awt.application.name=JWhisper',
                '--java-options', "-Djwhisper.runtimeVariant=${runtimeVariant}"
        ]
        if (JavaVersion.current().majorVersion.toInteger() >= 22) {
            cmd.addAll(['--java-options', '--enable-native-access=ALL-UNNAMED'])
        }
        if (mac) {
            cmd.addAll(['--mac-package-name', 'JWhisper'])
        }
        commandLine(cmd)
    }
}
