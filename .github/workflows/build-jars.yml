name: Build jwhisper jars

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: CPU / ${{ matrix.os }} / JDK ${{ matrix.java }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-26
        java:
          - '17'
          - '25'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test CPU runtime
        run: ./gradlew "-PjwhisperRuntime=cpu" clean test fatJar

      - name: Verify CLI launches
        run: ./gradlew "-PjwhisperRuntime=cpu" cli --args="--help"

      - name: Verify CLI diagnostics
        run: ./gradlew "-PjwhisperRuntime=cpu" cli --args="--diagnostics"

      - name: Upload CPU jar
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: jwhisper-cpu-${{ matrix.os }}
          path: build/libs/*cpu-all.jar

  reference-transcription:
    name: Reference transcription / tiny.en / JFK
    runs-on: ubuntu-latest
    env:
      JFK_COMMIT: 6e3be77e1a105e59086e3e21ff5f609fd6fa89a5
      JFK_SHA256: 63a4b1e4c1dc655ac70961ffbf518acd249df237e5a0152faae9a4a836949715
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download and verify pinned OpenAI Whisper reference fixture
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output build-jfk.flac \
            "https://raw.githubusercontent.com/openai/whisper/${JFK_COMMIT}/tests/jfk.flac"
          echo "${JFK_SHA256}  build-jfk.flac" | sha256sum --check

      - name: Transcribe reference fixture (TXT and SRT)
        run: |
          ./gradlew "-PjwhisperRuntime=cpu" cli --args="build-jfk.flac --model tiny.en --download-model --output build-jfk.txt --quiet"
          ./gradlew "-PjwhisperRuntime=cpu" cli --args="build-jfk.flac --model tiny.en --format srt --output build-jfk.srt --quiet"

      - name: Validate reference phrases and SRT cues
        shell: bash
        run: |
          set -euo pipefail
          normalized="$(tr '[:upper:]' '[:lower:]' < build-jfk.txt)"
          grep -Fq "my fellow americans" <<<"$normalized"
          grep -Fq "your country" <<<"$normalized"
          grep -Fq "do for you" <<<"$normalized"
          grep -Fq -- "-->" build-jfk.srt
          cat build-jfk.txt

      - name: Upload reference transcript
        uses: actions/upload-artifact@v4
        with:
          name: jwhisper-reference-jfk-transcript
          path: |
            build-jfk.txt
            build-jfk.srt

  apple-silicon:
    name: Apple Silicon CoreML jar
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Apple Silicon jar
        run: ./gradlew "-PjwhisperRuntime=apple" clean test fatJar

      - name: Upload Apple Silicon jar
        uses: actions/upload-artifact@v4
        with:
          name: jwhisper-apple-silicon-coreml
          path: build/libs/*apple-all.jar

  gpu:
    name: GPU CUDA jar
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build GPU jar
        run: ./gradlew "-PjwhisperRuntime=gpu" clean test fatJar

      - name: Upload GPU jar
        uses: actions/upload-artifact@v4
        with:
          name: jwhisper-gpu-cuda
          path: build/libs/*gpu-all.jar
